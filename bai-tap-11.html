      solution: C`
        using System;
        using System.Globalization;

        struct SinhVien
        {
            public string Ma, Ten;
            public double GK, CK;
            public double TK() { return GK * 0.4 + CK * 0.6; }
        }

        class Program
        {
            static string XepLoai(double d)
            {
                if (d >= 8.5) return "A";
                if (d >= 7.0) return "B";
                if (d >= 5.5) return "C";
                if (d >= 4.0) return "D";
                return "F";
            }

            static void Main(string[] args)
            {
                SinhVien[] ds = new SinhVien[100];
                int n = 0;
                Console.ReadLine();
                string line;
                while ((line = Console.ReadLine()) != null)
                {
                    if (line.Trim() == "") continue;
                    string[] f = line.Split(',');
                    ds[n].Ma = f[0].Trim();
                    ds[n].Ten = f[1].Trim();
                    ds[n].GK = double.Parse(f[2], CultureInfo.InvariantCulture);
                    ds[n].CK = double.Parse(f[3], CultureInfo.InvariantCulture);
                    n++;
                }
                for (int i = 1; i < n; i++)                 // sắp xếp chèn, giảm dần, ổn định
                {
                    SinhVien x = ds[i];
                    int j = i - 1;
                    while (j >= 0 && ds[j].TK() < x.TK()) { ds[j + 1] = ds[j]; j--; }
                    ds[j + 1] = x;
                }
                double tong = 0;
                for (int i = 0; i < n; i++)
                {
                    double tk = ds[i].TK();
                    tong += tk;
                    Console.WriteLine($"{ds[i].Ma} | {ds[i].Ten} | {tk:F1} | {XepLoai(tk)}");
                }
                Console.WriteLine($"TB lớp: {tong / n:F2}");
            }
        }` },

                Console.WriteLine($"Cao nhất: {ds[vt].Ten}");

        }` },
