      solution: C`
        using System;

        class Program
        {
            static int UCLN(int a, int b)
            {
                a = Math.Abs(a); b = Math.Abs(b);
                while (b != 0) { int r = a % b; a = b; b = r; }
                return a;
            }

            static void RutGon(ref int tu, ref int mau)
            {
                int u = UCLN(tu, mau);
                tu /= u; mau /= u;
                if (mau < 0) { tu = -tu; mau = -mau; }
            }

            static void Main(string[] args)
            {
                int tu = int.Parse(Console.ReadLine());
                int mau = int.Parse(Console.ReadLine());
                RutGon(ref tu, ref mau);
                Console.WriteLine(mau == 1 ? $"{tu}" : $"{tu}/{mau}");
            }
        }` },

                if (n == 0) return 1;
                return a * LuyThua(a, n - 1);

            static int TongChuSo(int n)

        using System;

        class Program
        {
            static int DaoSo(int n)
            {
                int dao = 0;
                while (n > 0) { dao = dao * 10 + n % 10; n /= 10; }
                return dao;
            }

            static bool LaDoiXung(int n)
            {
                return n == DaoSo(n);
            }

            static void Main(string[] args)
            {
                int n = int.Parse(Console.ReadLine());
                int dem = 0;
                for (int i = 1; i <= n; i++)
