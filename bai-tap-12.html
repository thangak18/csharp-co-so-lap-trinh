        using System;

        class Program
        {
            static int[] NhapMang()
            {
                int n = int.Parse(Console.ReadLine());
                int[] a = new int[n];
                string[] p = Console.ReadLine().Split(' ', StringSplitOptions.RemoveEmptyEntries);
                for (int i = 0; i < n; i++) a[i] = int.Parse(p[i]);
                return a;
            }

            static int TongLe(int[] a, int n)
            {
                int t = 0;
                for (int i = 0; i < n; i++) if (a[i] % 2 != 0) t += a[i];
                return t;
            }

            static int ViTriMaxCuoi(int[] a, int n)
            {
                int vt = 0;
                for (int i = 1; i < n; i++) if (a[i] >= a[vt]) vt = i;
                return vt;
            }

            static void SapXepGiam(int[] a, int n)
            {
                for (int i = 0; i < n - 1; i++)
                    for (int j = i + 1; j < n; j++)
                        if (a[j] > a[i]) { int t = a[i]; a[i] = a[j]; a[j] = t; }
            }

            static void XoaX(int[] a, ref int n, int x)
            {
                int k = 0;
                for (int i = 0; i < n; i++) if (a[i] != x) a[k++] = a[i];
                n = k;
            }

            static string Xuat(int[] a, int n)
            {
                if (n == 0) return "Mảng rỗng";
                string s = "";
                for (int i = 0; i < n; i++) s += (i > 0 ? " " : "") + a[i];
                return s;
            }

            static void Main(string[] args)
            {
                int[] a = NhapMang();
                int n = a.Length;
                int x = int.Parse(Console.ReadLine());
                Console.WriteLine($"Tổng lẻ: {TongLe(a, n)}");
                Console.WriteLine($"Vị trí max cuối: {ViTriMaxCuoi(a, n)}");
                SapXepGiam(a, n);
                Console.WriteLine($"Giảm dần: {Xuat(a, n)}");
                XoaX(a, ref n, x);
                Console.WriteLine($"Sau khi xóa x: {Xuat(a, n)}");
            }
        }` },

      solution: C`
        using System;

        class Program
        {
            static bool LaSNT(int n)
            {
                if (n < 2) return false;
                for (int i = 2; i * i <= n; i++) if (n % i == 0) return false;
                return true;
            }

            static void Main(string[] args)

                int m = int.Parse(mn[0]), n = int.Parse(mn[1]);
                int[,] a = new int[m, n];
                for (int i = 0; i < m; i++)
                {
                    string[] p = Console.ReadLine().Split(' ', StringSplitOptions.RemoveEmptyEntries);
                    for (int j = 0; j < n; j++) a[i, j] = int.Parse(p[j]);

                    int s = 0;

                for (int i = 0; i < m; i++)
                {
                    for (int j = 0; j < n; j++) Console.Write(a[i, j] + (j < n - 1 ? " " : ""));
                    Console.WriteLine();
                }
            }
        }` },
